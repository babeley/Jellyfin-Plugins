name: "Catalogue"
guid: "8a33dd74-dd06-4b9e-bf5e-ca8769d8c25a"
version: "1.3.2.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "babeley"
overview: "Bouton flottant qui ouvre un catalogue externe dans Jellyfin."
description: >
  Ajoute un bouton flottant (bandeau/coin de l'écran) au client web Jellyfin qui ouvre
  une page de catalogue externe (par exemple une page web personnalisée) dans un nouvel
  onglet ou la fenêtre courante. Compatible avec la disposition "Modern" (React/MUI) de
  Jellyfin 12 car le bouton est injecté hors de l'arbre React, via le plugin
  File Transformation. Nécessite l'installation préalable du plugin
  "File Transformation" (https://github.com/IAmParadox27/jellyfin-plugin-file-transformation).
category: "General"
artifacts:
  - "Jellyfin.Plugin.Catalogue.dll"
changelog: |
  - 1.3.2.0: Corrige le vrai bandeau dupliqué (persistant, pas un artefact
    d'animation) : si la page du catalogue contient un lien qui pointe vers ce même
    Jellyfin (ex. "voir dans Jellyfin"), cliquer dessus dans la surimpression y
    naviguait l'iframe, chargeant une seconde instance Jellyfin complète (avec son
    propre bandeau) au lieu de la page principale. Détecte cette navigation et
    redirige la vraie page vers cette URL en fermant la surimpression, plutôt que
    de laisser Jellyfin se charger imbriqué dans l'iframe.
