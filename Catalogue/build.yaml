version: "1.4.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "babeley"
overview: "Bouton flottant qui ouvre un catalogue externe dans Jellyfin."
description: >
  Ajoute un bouton flottant (bandeau/coin de l'écran) au client web Jellyfin qui ouvre
  une page de catalogue externe (par exemple une page web personnalisée) dans un nouvel
  onglet ou la fenêtre courante. Compatible avec la disposition "Modern" (React/MUI) de
  Jellyfin 12 car le bouton est injecté hors de l'arbre React, via le plugin
  File Transformation. Nécessite l'installation préalable du plugin
  "File Transformation" (https://github.com/IAmParadox27/jellyfin-plugin-file-transformation).
category: "General"
artifacts:
  - "Jellyfin.Plugin.Catalogue.dll"
changelog: |
  - 1.4.1.0: Nouvelle icône : Material Symbols "view_list" (fournie par l'utilisateur),
    à la place du pictogramme dessiné à la main.
  - 1.4.0.0: Corrige le bouton mal positionné sur petit écran (à côté du menu
    hamburger au lieu du groupe d'icônes). Retour à une insertion réelle dans le
    bandeau (comme jellyfin-enhanced), mais cette fois uniquement dans le groupe
    d'icônes (recherche/cast/SyncPlay/avatar) et jamais dans la ligne de liens de
    navigation (Favoris/Films/...), qui est la partie que React reconstruit à
    chaque changement de page et qui avait causé le bug de bandeau dupliqué en
    v1.2.1.0. Utilise les classes historiques de Jellyfin
    (paper-icon-button-light/headerButton) pour un rendu et un comportement
    responsive cohérents avec les icônes natives.
