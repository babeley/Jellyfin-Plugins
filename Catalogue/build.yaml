name: "Catalogue"
guid: "8a33dd74-dd06-4b9e-bf5e-ca8769d8c25a"
version: "1.1.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "babeley"
overview: "Bouton flottant qui ouvre un catalogue externe dans Jellyfin."
description: >
  Ajoute un bouton flottant (bandeau/coin de l'écran) au client web Jellyfin qui ouvre
  une page de catalogue externe (par exemple une page web personnalisée) dans un nouvel
  onglet ou la fenêtre courante. Compatible avec la disposition "Modern" (React/MUI) de
  Jellyfin 12 car le bouton est injecté hors de l'arbre React, via le plugin
  File Transformation. Nécessite l'installation préalable du plugin
  "File Transformation" (https://github.com/IAmParadox27/jellyfin-plugin-file-transformation).
category: "General"
artifacts:
  - "Jellyfin.Plugin.Catalogue.dll"
changelog: |
  - 1.1.0.0: Le bouton s'intègre maintenant dans le bandeau Jellyfin (à côté des
    icônes cast/recherche/avatar) au lieu de flotter en bas à droite, avec repli
    automatique en bouton flottant si le bandeau n'est pas trouvé. Quand "Ouvrir
    dans un nouvel onglet" est désactivé, le catalogue s'affiche maintenant dans
    une iframe en surimpression qui garde le bandeau Jellyfin visible, au lieu de
    remplacer complètement la page.
  - 1.0.2.0: Corrige la version affichée par Jellyfin (0.0.0.0 au lieu de la vraie
    version) : le csproj désactivait la génération d'AssemblyInfo sans fournir de
    remplacement, donc le binaire compilé n'avait jamais de numéro de version.
  - 1.0.1.0: Corrige l'enregistrement des réglages : la page de config utilisait un
    <script> qui n'est jamais exécuté par la disposition Modern de Jellyfin 12 (le
    HTML s'affiche mais aucun script séparé ne tourne). La logique est déplacée dans
    des attributs onload/onsubmit inline, qui sont bien exécutés dans ce contexte.
  - 1.0.0.0: Version initiale. Bouton flottant configurable (URL + ouverture nouvel onglet/fenêtre courante).
